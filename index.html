<body>
    
    
    <div id="painel">
        <div id="btn-toggle" onclick="toggleMenu()">☰</div>
        <b style="font-size: 15px;">🚜 GESTÃO CLEALCO</b><hr>
        <input list="lista_fazendas" id="input_fazenda" oninput="atualizarMapa()" placeholder="🔍 Buscar Fazenda..." style="width: 90%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
        <datalist id="lista_fazendas"><option value="100453"><option value="107383"><option value="200501"><option value="202944"><option value="202948"></datalist>
        <div style="font-size: 12px; margin-top:10px;">
            <b>🎨 Temas:</b><br>
            <input type="radio" name="tema" onclick="mudarTema(1)" checked> Tiros 
            <input type="radio" name="tema" onclick="mudarTema(2)"> Exportação
        </div>
        <hr>
        <div style="font-size: 12px;">
            <input type="checkbox" id="chk_divisas" checked onclick="toggleDivisas()"> Ver Divisas<br>
            <input type="checkbox" id="chk_satelite" checked onclick="toggleSatelite()"> Satélite
        </div>
        <button onclick="location.reload()" style="width: 100%; margin-top: 10px; padding: 5px; cursor: pointer;">🔄 Resetar</button>
    </div>
    
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(() => console.log("Offline OK"));
    }

    var mapObj, tilesCarregados = new Set(), filtroFazenda = "", temaAtivo = 1, camadasLinhas = [], marcadoresLabels = [], camadaDivisas = null;

    function toggleMenu() {
        document.getElementById('painel').classList.toggle('minimizado');
    }

    $(document).ready(function() {
        setTimeout(function() {
            mapObj = window[document.querySelector('.folium-map').id];
            mapObj.createPane('pane_divisas').style.zIndex = 650;
            
            $.getJSON("divisas.json", function(data) {
                camadaDivisas = L.geoJson(data, {
                    pane: 'pane_divisas',
                    style: function(f) { return { color: "black", weight: 3, fillOpacity: 0, opacity: 0 }; },
                    onEachFeature: function(f, l) { l.bindPopup("<b>TALHÃO:</b> "+f.properties.TALHAO); }
                }).addTo(mapObj);
            });

            $.getJSON("labels.json", function(data) {
                data.forEach(function(l) {
                    var m = L.marker([l.lat, l.lng], { icon: L.divIcon({ className: 'rotulo-hd', html: l.talhao }), alt: l.fazenda });
                    marcadoresLabels.push(m);
                });
            });

            $.getJSON("manifesto.json", function(data) {
                mapObj.on('moveend', function() { scanTiles(data); });
                scanTiles(data);
            });
        }, 600);
    });

    function atualizarMapa() { 
        filtroFazenda = document.getElementById('input_fazenda').value;
        refreshVisual(); 
        if (filtroFazenda) {
            var pts = marcadoresLabels.filter(m => m.options.alt === filtroFazenda).map(m => m.getLatLng());
            if (pts.length > 0) mapObj.fitBounds(L.latLngBounds(pts), { padding: [50, 50] });
        }
    }

    function refreshVisual() {
        var showAll = (filtroFazenda !== "");
        if (camadaDivisas) {
            camadaDivisas.eachLayer(function(l) {
                var match = showAll && l.feature.properties.FAZENDA.toString().toUpperCase() === filtroFazenda.toUpperCase();
                l.setStyle({ opacity: match ? 1 : 0, weight: match ? 3 : 0 });
            });
        }
        camadasLinhas.forEach(function(c) {
            c.eachLayer(function(l) {
                var p = l.feature.properties;
                var match = showAll && p.FAZENDA === filtroFazenda;
                l.setStyle({ opacity: match ? 0.8 : 0, weight: match ? 1 : 0, color: (temaAtivo == 1 ? getCor(p.CLASSE) : p.color_talhao) });
            });
        });
        marcadoresLabels.forEach(function(m) {
            if (showAll && temaAtivo == 2 && m.options.alt === filtroFazenda) { m.addTo(mapObj); }
            else { mapObj.removeLayer(m); }
        });
    }

    function getCor(v) { return v <= 150 ? '#ff0000' : v <= 300 ? '#ffff00' : v <= 450 ? '#00ff00' : '#00fffa'; }
    
    function scanTiles(manifesto) { 
        if (!filtroFazenda) return;
        var vB = mapObj.getBounds();
        manifesto.forEach(function(t) {
            if (vB.intersects(L.latLngBounds(t.bounds)) && !tilesCarregados.has(t.arquivo)) {
                tilesCarregados.add(t.arquivo);
                $.getJSON("tiles/" + t.arquivo, function(geo) {
                    var layer = L.geoJson(geo).addTo(mapObj);
                    camadasLinhas.push(layer);
                    refreshVisual();
                });
            }
        });
    }
    function mudarTema(t) { temaAtivo = t; refreshVisual(); }
    function toggleDivisas() { if (document.getElementById('chk_divisas').checked) mapObj.addLayer(camadaDivisas); else mapObj.removeLayer(camadaDivisas); }
    function toggleSatelite() { mapObj.eachLayer(function(l) { if (l._url && l._url.includes('google')) { if (document.getElementById('chk_satelite').checked) mapObj.addLayer(l); else mapObj.removeLayer(l); } }); }
    </script>

</body>
