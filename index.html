<body>
    
    
    <div id="painel">
        <b style="font-size: 15px;">🚜 GESTÃO CLEALCO</b><br><br>
        <input list="lista_fazendas" id="input_fazenda" oninput="atualizarMapa()" value="100453" placeholder="🔍 Buscar Fazenda..." style="width: 90%; padding: 8px; border-radius: 5px;">
        <datalist id="lista_fazendas"><option value="100453"><option value="107383"><option value="200501"><option value="202944"><option value="202948"></datalist>
        <hr>
        <div style="font-size: 12px;">
            <b>🎨 Temas:</b><br>
            <input type="radio" name="tema" onclick="mudarTema(1)" checked> Classificação de tiro<br>
            <input type="radio" name="tema" onclick="mudarTema(2)"> Classificação de exportação
        </div>
        <hr>
        <div style="font-size: 12px;">
            <b>⚙️ Visualização:</b><br>
            <input type="checkbox" id="chk_divisas" checked onclick="toggleDivisas()"> Ver Talhões<br>
            <input type="checkbox" id="chk_satelite" checked onclick="toggleSatelite()"> Imagem de Satélite
        </div>
        <br>
        <button onclick="location.reload()" style="width: 100%; padding: 5px; cursor: pointer;">🔄 Resetar Mapa</button>
    </div>
    <div id="legenda-tiro">
        <b>Legenda Tiros</b><br><br>
        <i style="background:#ff0000"></i> 0 - 150<br>
        <i style="background:#ffff00"></i> 151 - 300<br>
        <i style="background:#00ff00"></i> 301 - 450<br>
        <i style="background:#00fffa"></i> > 450
    </div>
    <div id="rodape-clealco">Desenvolvido por Geotecnologia Clealco</div>
    
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    var mapObj = null, tilesCarregados = new Set(), filtroFazenda = "100453", temaAtivo = 1, camadasLinhas = [], marcadoresLabels = [], camadaDivisas = null;

    $(document).ready(function() {
        setTimeout(function() {
            mapObj = window[document.querySelector('.folium-map').id];
            
            // Panes para Z-Index
            mapObj.createPane('pane_divisas').style.zIndex = 650;
            mapObj.createPane('pane_labels').style.zIndex = 700;

            // 1. CARREGAR DIVISAS (Começam escondidas se não forem a primeira fazenda)
            $.getJSON("divisas.json", function(data) {
                camadaDivisas = L.geoJson(data, {
                    pane: 'pane_divisas',
                    style: function(feature) {
                        var visivel = (filtroFazenda === "" || feature.properties.FAZENDA === filtroFazenda);
                        return { 
                            color: "black", 
                            weight: visivel ? 3 : 0, 
                            opacity: visivel ? 1 : 0, 
                            fillOpacity: 0,
                            interactive: visivel 
                        };
                    },
                    onEachFeature: function(f, l) {
                        var p = f.properties;
                        l.bindPopup("<b>FAZENDA:</b> "+p.FAZENDA+"<br><b>NOME:</b> "+p.NOME_FAZ+"<br><b>ZONA:</b> "+p.ZONA+"<br><b>TALHÃO:</b> "+p.TALHAO+"<br><b>ÁREA:</b> "+p.AREA_TOTAL);
                    }
                }).addTo(mapObj);
            });

            // 2. CARREGAR LABELS
            $.getJSON("labels.json", function(data) {
                data.forEach(function(l) {
                    var m = L.marker([l.lat, l.lng], { icon: L.divIcon({ className: 'rotulo-hd', html: l.talhao }), alt: l.fazenda, pane: 'pane_labels' });
                    marcadoresLabels.push(m);
                });
                refreshVisual();
                if (filtroFazenda !== "") { atualizarMapa(); }
            });

            // 3. CARREGAR TILES
            $.getJSON("manifesto.json", function(data) {
                mapObj.on('moveend', function() { scanTiles(data); });
                scanTiles(data);
            });
        }, 600);
    });

    function atualizarMapa() { 
        filtroFazenda = document.getElementById('input_fazenda').value;
        refreshVisual(); 
        if (filtroFazenda !== "") {
            var pts = marcadoresLabels.filter(m => m.options.alt === filtroFazenda).map(m => m.getLatLng());
            if (pts.length > 0) { mapObj.fitBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 18 }); }
        }
    }

    function refreshVisual() {
        // FILTRAR LINHAS DE COLHEITA
        camadasLinhas.forEach(c => c.eachLayer(l => {
            var p = l.feature.properties;
            var isFazenda = (filtroFazenda === "" || p.FAZENDA === filtroFazenda);
            if (!isFazenda) {
                l.setStyle({ opacity: 0, weight: 0, fillOpacity: 0 });
            } else {
                l.setStyle({ color: (temaAtivo == 1 ? getCor(p.CLASSE) : p.color_talhao), weight: 1, opacity: 0.8, fillOpacity: 0.4 });
            }
        }));

        // FILTRAR DIVISAS PRETAS
        if (camadaDivisas) {
            camadaDivisas.eachLayer(l => {
                var isFazenda = (filtroFazenda === "" || l.feature.properties.FAZENDA === filtroFazenda);
                if (!isFazenda) {
                    l.setStyle({ opacity: 0, weight: 0, interactive: false });
                } else {
                    l.setStyle({ color: "black", weight: 3, opacity: 1, interactive: true });
                }
            });
        }

        // FILTRAR RÓTULOS
        marcadoresLabels.forEach(m => {
            var isFazenda = (filtroFazenda === "" || m.options.alt === filtroFazenda);
            if (temaAtivo == 2 && isFazenda) { m.addTo(mapObj); }
            else { mapObj.removeLayer(m); }
        });
    }

    function scanTiles(manifesto) {
        var vB = mapObj.getBounds();
        manifesto.forEach(t => {
            if (vB.intersects(L.latLngBounds(t.bounds)) && !tilesCarregados.has(t.arquivo)) {
                tilesCarregados.add(t.arquivo);
                $.getJSON("tiles/" + t.arquivo, function(geo) {
                    var layer = L.geoJson(geo).addTo(mapObj);
                    camadasLinhas.push(layer);
                    refreshVisual();
                });
            }
        });
    }

    function getCor(v) { return v <= 150 ? '#ff0000' : v <= 300 ? '#ffff00' : v <= 450 ? '#00ff00' : '#00fffa'; }
    function mudarTema(t) { temaAtivo = t; document.getElementById('legenda-tiro').style.display = (t == 1) ? 'block' : 'none'; refreshVisual(); }
    function toggleDivisas() { if (document.getElementById('chk_divisas').checked) { mapObj.addLayer(camadaDivisas); } else { mapObj.removeLayer(camadaDivisas); } }
    function toggleSatelite() { mapObj.eachLayer(l => { if (l._url && l._url.includes('google')) { if (document.getElementById('chk_satelite').checked) mapObj.addLayer(l); else mapObj.removeLayer(l); } }); }
    </script>
    
    
            <div class="folium-map" id="map_42e18e59c81b033df983b6c8d295e3c0" ></div>
        
</body>
