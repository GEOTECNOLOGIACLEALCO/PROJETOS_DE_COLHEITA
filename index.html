<body>
    
    
    <div id="painel">
        <b style="font-size: 16px;">🚜 PROJETOS DE COLHEITA</b><br><br>
        <input list="lista_fazendas" id="input_fazenda" oninput="atualizarMapa()" placeholder="🔍 Selecione a Fazenda..." style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
        <datalist id="lista_fazendas"><option value="100453"><option value="107383"><option value="200501"><option value="202944"><option value="202948"></datalist>
        <br><br>
        <input type="radio" name="tema" onclick="mudarTema(1)" checked> Classificação de tiro<br>
        <input type="radio" name="tema" onclick="mudarTema(2)"> Classificação de exportação<br><br>
        <button onclick="location.reload()" style="width: 100%; padding: 8px; cursor: pointer; background: #eee; border: 1px solid #aaa; border-radius: 5px;">Resetar Visão</button>
    </div>
    <div id="legenda-tiro">
        <b style="font-size: 13px;">Legenda de Tiros</b><br><br>
        <i style="background:#ff0000"></i> 0 - 150<br>
        <i style="background:#ffff00"></i> 151 - 300<br>
        <i style="background:#00ff00"></i> 301 - 450<br>
        <i style="background:#00fffa"></i> > 450
    </div>
    <div id="rodape-clealco">Desenvolvido por Geotecnologia Clealco</div>
    
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    var mapObj = null, tilesCarregados = new Set(), filtroFazenda = "", temaAtivo = 1, camadasGeo = [], marcadoresLabels = [];

    $(document).ready(function() {
        setTimeout(function() {
            mapObj = window[document.querySelector('.folium-map').id];
            
            $.getJSON("labels.json", function(data) {
                data.forEach(function(l) {
                    var marker = L.marker([l.lat, l.lng], {
                        icon: L.divIcon({ className: 'rotulo-unico', html: l.talhao }),
                        alt: l.fazenda
                    });
                    marcadoresLabels.push(marker);
                });
                refreshVisual();
            });

            $.getJSON("manifesto.json", function(data) {
                // Só verifica tiles quando o mapa para de se mexer (ganha muita velocidade)
                mapObj.on('moveend', function() { scanTiles(data); });
                scanTiles(data);
            });
        }, 600);
    });

    function mudarTema(t) { 
        temaAtivo = t; 
        document.getElementById('legenda-tiro').style.display = (t == 1) ? 'block' : 'none';
        refreshVisual(); 
    }

    function atualizarMapa() { 
        filtroFazenda = document.getElementById('input_fazenda').value;
        refreshVisual();
        if (filtroFazenda !== "") {
            var farmPoints = marcadoresLabels.filter(m => m.options.alt === filtroFazenda).map(m => m.getLatLng());
            if (farmPoints.length > 0) {
                var group = new L.featureGroup(marcadoresLabels.filter(m => m.options.alt === filtroFazenda));
                mapObj.fitBounds(group.getBounds(), { padding: [50, 50], maxZoom: 18 });
            }
        }
    }

    function refreshVisual() {
        camadasGeo.forEach(c => c.eachLayer(l => {
            var p = l.feature.properties;
            if (filtroFazenda !== "" && p.FAZENDA !== filtroFazenda) {
                l.setStyle({ opacity: 0, weight: 0 });
            } else {
                l.setStyle({ color: (temaAtivo == 1 ? getCor(p.CLASSE) : p.color_talhao), weight: 1, opacity: 0.8 });
            }
        }));
        marcadoresLabels.forEach(m => {
            if (temaAtivo == 2 && (filtroFazenda === "" || m.options.alt === filtroFazenda)) { m.addTo(mapObj); }
            else { mapObj.removeLayer(m); }
        });
    }

    function getCor(v) {
        if (v <= 150) return '#ff0000';
        if (v <= 300) return '#ffff00';
        if (v <= 450) return '#00ff00';
        return '#00fffa';
    }

    function scanTiles(manifesto) {
        // Só carrega tiles se o zoom for maior que 14 (evita carregar tudo no zoom out)
        if (mapObj.getZoom() < 14) return;

        var vBounds = mapObj.getBounds();
        manifesto.forEach(function(tile) {
            if (vBounds.intersects(L.latLngBounds(tile.bounds)) && !tilesCarregados.has(tile.arquivo)) {
                tilesCarregados.add(tile.arquivo);
                $.getJSON("tiles/" + tile.arquivo, function(geo) {
                    var layer = L.geoJson(geo).addTo(mapObj);
                    camadasGeo.push(layer);
                    refreshVisual();
                });
            }
        });
    }
    </script>
