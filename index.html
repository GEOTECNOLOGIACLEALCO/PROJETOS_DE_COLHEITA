<body>
    
    
    <div id="painel-controle">
        <h3 style="margin-top:0;">🚜 AGRO MAPA</h3>
        
        <div class="item-menu">
            <b>🔍 Buscar Fazenda:</b><br>
            <input list="lista_fazendas" id="input_fazenda" oninput="executarFiltro()" placeholder="Escreva o nome..." style="width: 100%; padding: 8px; border: 1px solid #ccc;">
            <datalist id="lista_fazendas"><option value="300044"><option value="300492"><option value="301482"><option value="302979 - 302980"><option value="302981"><option value="306513"><option value="307214"><option value="307345"><option value="308054"></datalist>
        </div>

        <div class="item-menu">
            <b>🎨 Escolher Tema:</b><br>
            <input type="radio" name="tema" onclick="trocarTema(1)" checked> Tema 01 (Classes)<br>
            <input type="radio" name="tema" onclick="trocarTema(2)"> Tema 02 (Talhões)
        </div>

        <button class="btn-reset" onclick="location.reload()">🔄 Resetar Mapa</button>
    </div>
    
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    var mapObj = null;
    var tilesCarregados = new Set();
    var filtroFazenda = "";
    var temaAtivo = 1; 
    var camadasGeo = [];
    var markersList = [];

    $(document).ready(function() {
        setTimeout(function() {
            mapObj = window[document.querySelector('.folium-map').id];
            $.getJSON("manifesto.json", function(data) {
                mapObj.on('moveend', function() { scanTiles(data); });
                scanTiles(data);
            });
        }, 600);
    });

    function trocarTema(t) {
        temaAtivo = t;
        refreshVisual();
        document.getElementById('legenda_tiro').style.display = (temaAtivo == 1) ? 'block' : 'none';
    }

    function executarFiltro() {
        filtroFazenda = document.getElementById('input_fazenda').value;
        refreshVisual();
    }

    function refreshVisual() {
        camadasGeo.forEach(function(c) {
            c.eachLayer(function(l) {
                var p = l.feature.properties;
                if (filtroFazenda !== "" && p.FAZENDA !== filtroFazenda) {
                    l.setStyle({ opacity: 0, weight: 0, fillOpacity: 0 });
                } else {
                    var cor = (temaAtivo == 1) ? getCorClasse(p.CLASSE) : p.color_talhao;
                    l.setStyle({ color: cor, weight: 1, opacity: 0.8, fillOpacity: 0.4 });
                }
            });
        });

        markersList.forEach(function(m) {
            var visivel = (temaAtivo == 2) && (filtroFazenda === "" || m.options.alt === filtroFazenda);
            if (visivel) { m.addTo(mapObj); } else { mapObj.removeLayer(m); }
        });
    }

    function getCorClasse(v) {
        return v <= 150 ? '#8c0000' : v <= 300 ? '#ff0000' : v <= 450 ? '#ffff00' : v <= 700 ? '#00ff00' : '#00fffa';
    }

    function scanTiles(manifesto) {
        var vBounds = mapObj.getBounds();
        manifesto.forEach(function(tile) {
            if (vBounds.intersects(L.latLngBounds(tile.bounds)) && !tilesCarregados.has(tile.arquivo)) {
                tilesCarregados.add(tile.arquivo);
                $.getJSON("tiles/" + tile.arquivo, function(geo) {
                    var layer = L.geoJson(geo, {
                        onEachFeature: function(f, l) {
                            l.bindTooltip("Talhão: " + f.properties.TALHAO);
                            var marker = L.marker(l.getBounds().getCenter(), {
                                icon: L.divIcon({ className: 'rotulo-agro', html: '<b style="color:white; text-shadow: 1px 1px 2px black;">'+f.properties.TALHAO+'</b>' }),
                                alt: f.properties.FAZENDA
                            });
                            markersList.push(marker);
                        }
                    }).addTo(mapObj);
                    camadasGeo.push(layer);
                    refreshVisual();
                });
            }
        });
    }
    </script>
    
    <div id="legenda_tiro" style="position: fixed; bottom: 30px; left: 30px; width: 130px; z-index:9999; background: white; padding: 10px; border: 2px solid black; font-size: 11px;"><b>Legenda Tiro</b><br><i style="background:#8c0000;width:8px;height:8px;display:inline-block"></i> 0-150<br><i style="background:#ff0000;width:8px;height:8px;display:inline-block"></i> 150-300<br><i style="background:#ffff00;width:8px;height:8px;display:inline-block"></i> 300-450<br><i style="background:#00ff00;width:8px;height:8px;display:inline-block"></i> 450-700<br><i style="background:#00fffa;width:8px;height:8px;display:inline-block"></i> > 700</div>
