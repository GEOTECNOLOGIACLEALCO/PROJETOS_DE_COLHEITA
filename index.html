    <style>
        :root { --main-green: #1b5e20; }
        #painel { 
            position: fixed; top: 10px; left: 10px; z-index: 9999; 
            background: rgba(255,255,255,0.95); backdrop-filter: blur(5px);
            padding: 15px; border-radius: 15px; font-family: sans-serif; 
            width: 270px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); border: 2px solid var(--main-green);
            transition: 0.3s ease-in-out;
        }
        #painel.minimizado { transform: translateX(-285px); }
        #btn-toggle { 
            position: absolute; right: -50px; top: 10px; background: var(--main-green); color: white;
            border: none; width: 45px; height: 45px; cursor: pointer; border-radius: 10px; font-size: 20px;
        }
        .btn-tech {
            width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 8px;
            background: var(--main-green); color: white; font-weight: bold; font-size: 13px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .rotulo-hd { color: black !important; font-weight: 900 !important; font-size: 16px !important; text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff; white-space: nowrap; pointer-events: none; background: none !important; border: none !important; }
        .user-loc { width: 12px; height: 12px; background: #007bff; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 10px #007bff; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }
        #legenda-container { font-size: 10px; margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    </style>

                initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

                #map_5f541aa9b7d318abf6198c569778d522 {
                    position: relative;

                width: 100%;

                margin: 0;
                padding: 0;

            </style>

                position:absolute;
                top:0;
                bottom:0;
                right:0;
                left:0;

</head>
<body>
    
    
    <div id="painel">
        <button id="btn-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
        <div style="text-align:center; margin-bottom:10px;">
            <b style="color:#1b5e20; font-size:16px;">CLEALCO GEOTEC</b>
        </div>
        
        <input list="lista_fazendas" id="input_fazenda" oninput="atualizarMapa()" placeholder="🔍 Pesquisar Fazenda...">
        <datalist id="lista_fazendas"><option value="100453"><option value="107383"><option value="200501"><option value="202944"><option value="202948"></datalist>
        
        <button class="btn-tech" onclick="irParaRota()"><i class="fas fa-location-arrow"></i> ROTA GOOGLE</button>
        <button class="btn-tech" style="background:#444" onclick="minhaPosicao()"><i class="fas fa-crosshairs"></i> MEU GPS</button>

        <div id="legenda-container">
            <label><input type="checkbox" id="chk_divisas" checked onclick="toggleDivisas()"> Divisas</label>
            <label><input type="checkbox" id="chk_satelite" checked onclick="toggleSatelite()"> Satélite</label>
            <label><input type="radio" name="tema" onclick="mudarTema(1)" checked> Tiros</label>
            <label><input type="radio" name="tema" onclick="mudarTema(2)"> Talhões</label>
        </div>
        <button class="btn-tech" style="background:#eee; color:#333; margin-top:15px; padding:5px; font-size:10px;" onclick="location.reload()">Sincronizar Dados</button>
    </div>
    
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }

    var mapObj, userMarker, farmCenter = null, tilesCarregados = new Set(), filtroFazenda = "", temaAtivo = 1, camadaDivisas = null, camadasLinhas = [], marcadoresLabels = [];

    function toggleMenu() { document.getElementById('painel').classList.toggle('minimizado'); }

    $(document).ready(function() {
        setTimeout(function() {
            mapObj = window[document.querySelector('.folium-map').id];
            mapObj.createPane('pane_divisas').style.zIndex = 650;
            
            $.getJSON("labels.json", function(data) {
                data.forEach(function(l) {
                    var m = L.marker([l.lat, l.lng], { 
                        icon: L.divIcon({ className: 'rotulo-hd', html: l.talhao }), 
                        alt: l.fazenda.toString().toUpperCase() 
                    });
                    marcadoresLabels.push(m);
                });
            });

            $.getJSON("manifesto.json", function(data) {
                mapObj.on('moveend', function() { scanTiles(data); });
                scanTiles(data);
            });
        }, 800);
    });

    function atualizarMapa() {
        var inputVal = document.getElementById('input_fazenda').value.trim().toUpperCase();
        if (!inputVal || inputVal === filtroFazenda) return;
        filtroFazenda = inputVal;

        if (camadaDivisas) mapObj.removeLayer(camadaDivisas);
        var nomeArquivo = "divisas_" + filtroFazenda.replace(/ /g, "_") + ".json";
        
        $.getJSON("divisas_split/" + nomeArquivo, function(data) {
            camadaDivisas = L.geoJson(data, {
                pane: 'pane_divisas',
                style: { color: "white", weight: 2, fillOpacity: 0.1 },
                onEachFeature: (f, l) => {
                    var h = "<b>INFO TALHÃO</b><hr>";
                    for (var k in f.properties) h += "<b>"+k+":</b> "+f.properties[k]+"<br>";
                    l.bindPopup(h);
                }
            }).addTo(mapObj);
            farmCenter = camadaDivisas.getBounds().getCenter();
            mapObj.fitBounds(camadaDivisas.getBounds());
        });

        refreshVisual();
    }

    function refreshVisual() {
        var show = (filtroFazenda !== "");
        camadasLinhas.forEach(function(c) {
            c.eachLayer(function(l) {
                var p = l.feature.properties;
                // Usando placeholders que o Python vai substituir depois do raw
                var match = show && p['FAZENDA'].toString().trim().toUpperCase() === filtroFazenda;
                l.setStyle({ 
                    opacity: match ? 0.8 : 0, 
                    weight: match ? 1 : 0, 
                    color: (temaAtivo == 1 ? getCorTiro(p['CLASSE']) : p.color_talhao),
                    interactive: match 
                });
            });
        });
        marcadoresLabels.forEach(function(m) {
            if (show && m.options.alt === filtroFazenda) m.addTo(mapObj); else mapObj.removeLayer(m);
        });
    }

    function getCorTiro(v) { return v <= 150 ? '#ff0000' : v <= 300 ? '#ffff00' : v <= 450 ? '#00ff00' : '#00fffa'; }

    function scanTiles(manifesto) {
        if (!filtroFazenda) return;
        var vB = mapObj.getBounds();
        manifesto.forEach(function(t) {
            if (vB.intersects(L.latLngBounds(t.bounds)) && !tilesCarregados.has(t.arquivo)) {
                tilesCarregados.add(t.arquivo);
                $.getJSON("tiles/" + t.arquivo, function(geo) {
                    var layer = L.geoJson(geo, {
                        onEachFeature: (f,l) => l.bindPopup("<b>Comp:</b> "+f.properties.COMP_M.toFixed(1)+"m")
                    }).addTo(mapObj);
                    camadasLinhas.push(layer);
                    refreshVisual();
                });
            }
        });
    }

    function minhaPosicao() {
        mapObj.locate({setView: true, maxZoom: 16});
        mapObj.on('locationfound', function(e) {
            if (userMarker) mapObj.removeLayer(userMarker);
            userMarker = L.marker(e.latlng, { icon: L.divIcon({ className: 'user-loc' }) }).addTo(mapObj);
        });
    }

    function irParaRota() {
        if (!farmCenter) return alert("Filtre uma fazenda primeiro!");
        window.open("https://www.google.com/maps/dir/?api=1&destination=" + farmCenter.lat + "," + farmCenter.lng);
    }

    function mudarTema(t) { temaAtivo = t; refreshVisual(); }
    function toggleDivisas() { if (camadaDivisas) { if (document.getElementById('chk_divisas').checked) mapObj.addLayer(camadaDivisas); else mapObj.removeLayer(camadaDivisas); } }
    function toggleSatelite() { mapObj.eachLayer(l => { if (l._url && l._url.includes('google')) { if (document.getElementById('chk_satelite').checked) mapObj.addLayer(l); else mapObj.removeLayer(l); } }); }
    
    </script>

</body>
