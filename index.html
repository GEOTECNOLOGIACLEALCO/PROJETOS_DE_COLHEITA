<body>
    
    
    <div id="painel">
        <b style="font-size: 15px;">🚜 GESTÃO CLEALCO</b><br><br>
        <input list="lista_fazendas" id="input_fazenda" oninput="atualizarMapa()" placeholder="🔍 Selecione a Fazenda..." style="width: 90%; padding: 8px;">
        <datalist id="lista_fazendas"><option value="100453"><option value="107383"><option value="200501"><option value="202944"><option value="202948"></datalist>
        <hr>
        <div style="font-size: 12px;">
            <b>🎨 Temas:</b><br>
            <input type="radio" name="tema" onclick="mudarTema(1)" checked> Classificação de tiro<br>
            <input type="radio" name="tema" onclick="mudarTema(2)"> Classificação de talhão
        </div>
        <hr>
        <div style="font-size: 12px;">
            <b>⚙️ Visualização:</b><br>
            <input type="checkbox" id="chk_divisas" checked onclick="toggleDivisas()"> Ver Divisas Talhões<br>
            <input type="checkbox" id="chk_satelite" checked onclick="toggleSatelite()"> Imagem Satélite
        </div>
        <br>
        <button onclick="location.reload()" style="width: 100%; padding: 5px; cursor: pointer;">🔄 Resetar Mapa</button>
    </div>
    <div id="legenda-tiro">
        <b>Legenda Tiros</b><br><br>
        <i style="background:#ff0000"></i> 0 - 150<br>
        <i style="background:#ffff00"></i> 151 - 300<br>
        <i style="background:#00ff00"></i> 301 - 450<br>
        <i style="background:#00fffa"></i> > 450
    </div>
    <div id="rodape-clealco">Desenvolvido por Geotecnologia Clealco</div>
    
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    var mapObj = null, tilesCarregados = new Set(), filtroFazenda = "", temaAtivo = 1, camadasLinhas = [], marcadoresLabels = [], camadaDivisas = null;
    var camadaSatelite = null, camadaMapaBase = null;

    $(document).ready(function() {
        setTimeout(function() {
            mapObj = window[document.querySelector('.folium-map').id];
            
            // Criar um "Pane" (Painel) especial para as divisas ficarem sempre no topo
            mapObj.createPane('pane_divisas');
            mapObj.getPane('pane_divisas').style.zIndex = 650; // Acima das linhas, abaixo do UI
            mapObj.getPane('pane_divisas').style.pointerEvents = 'none'; // Permite clicar nas linhas se precisar

            mapObj.eachLayer(function(l) {
                if (l._url && l._url.includes('google')) camadaSatelite = l;
                if (l._url && l._url.includes('openstreetmap')) camadaMapaBase = l;
            });

            // 1. CARREGAR DIVISAS (NO PANE SUPERIOR)
            $.getJSON("divisas.json", function(data) {
                camadaDivisas = L.geoJson(data, {
                    pane: 'pane_divisas', // <-- O segredo para ficar por cima!
                    style: { color: "black", weight: 3, fillOpacity: 0, interactive: true },
                    onEachFeature: function(f, l) {
                        var p = f.properties;
                        l.bindPopup("<b>FAZENDA:</b> "+p.FAZENDA+"<br><b>NOME:</b> "+p.NOME_FAZ+"<br><b>ZONA:</b> "+p.ZONA+"<br><b>TALHÃO:</b> "+p.TALHAO+"<br><b>ÁREA:</b> "+p.AREA_TOTAL);
                    }
                }).addTo(mapObj);
            });

            // 2. LABELS
            $.getJSON("labels.json", function(data) {
                data.forEach(function(l) {
                    var m = L.marker([l.lat, l.lng], { 
                        icon: L.divIcon({ className: 'rotulo-unico', html: l.talhao }), 
                        alt: l.fazenda,
                        zIndexOffset: 1000 // Rótulos sempre acima de tudo
                    });
                    marcadoresLabels.push(m);
                });
                refreshVisual();
            });

            // 3. TILES
            $.getJSON("manifesto.json", function(data) {
                mapObj.on('moveend', function() { scanTiles(data); });
                scanTiles(data);
            });
        }, 600);
    });

    function toggleDivisas() {
        if (document.getElementById('chk_divisas').checked) { mapObj.addLayer(camadaDivisas); }
        else { mapObj.removeLayer(camadaDivisas); }
    }

    function toggleSatelite() {
        if (document.getElementById('chk_satelite').checked) { mapObj.addLayer(camadaSatelite); mapObj.removeLayer(camadaMapaBase); }
        else { mapObj.addLayer(camadaMapaBase); mapObj.removeLayer(camadaSatelite); }
    }

    function mudarTema(t) { 
        temaAtivo = t; 
        document.getElementById('legenda-tiro').style.display = (t == 1) ? 'block' : 'none';
        refreshVisual(); 
    }

    function atualizarMapa() { 
        filtroFazenda = document.getElementById('input_fazenda').value;
        refreshVisual();
        if (filtroFazenda !== "") {
            var pts = marcadoresLabels.filter(m => m.options.alt === filtroFazenda).map(m => m.getLatLng());
            if (pts.length > 0) { mapObj.fitBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 18 }); }
        }
    }

    function refreshVisual() {
        camadasLinhas.forEach(c => c.eachLayer(l => {
            var p = l.feature.properties;
            if (filtroFazenda !== "" && p.FAZENDA !== filtroFazenda) { l.setStyle({ opacity: 0, weight: 0 }); }
            else { l.setStyle({ color: (temaAtivo == 1 ? getCor(p.CLASSE) : p.color_talhao), weight: 1, opacity: 0.8 }); }
        }));
        marcadoresLabels.forEach(m => {
            if (temaAtivo == 2 && (filtroFazenda === "" || m.options.alt === filtroFazenda)) { m.addTo(mapObj); }
            else { mapObj.removeLayer(m); }
        });
    }

    function getCor(v) {
        if (v <= 150) return '#ff0000';
        if (v <= 300) return '#ffff00';
        if (v <= 450) return '#00ff00';
        return '#00fffa';
    }

    function scanTiles(manifesto) {
        if (mapObj.getZoom() < 14) return;
        var vB = mapObj.getBounds();
        manifesto.forEach(t => {
            if (vB.intersects(L.latLngBounds(t.bounds)) && !tilesCarregados.has(t.arquivo)) {
                tilesCarregados.add(t.arquivo);
                $.getJSON("tiles/" + t.arquivo, function(geo) {
                    var layer = L.geoJson(geo).addTo(mapObj);
                    camadasLinhas.push(layer);
                    refreshVisual();
                });
            }
        });
    }
    </script>
