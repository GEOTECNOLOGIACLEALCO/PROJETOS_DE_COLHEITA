<body>
    
    
    <div id="painel">
        <b>🚜 CONTROLE AGRO</b><br><br>
        <input list="lista_fazendas" id="input_fazenda" oninput="atualizarMapa()" placeholder="Filtrar Fazenda..." style="width: 100%;"><br><br>
        <input type="radio" name="tema" onclick="mudarTema(1)" checked> Tema 01 (Classes)<br>
        <input type="radio" name="tema" onclick="mudarTema(2)"> Tema 02 (Talhões)<br><br>
        <button onclick="location.reload()" style="width: 100%;">Resetar Mapa</button>
        <datalist id="lista_fazendas"><option value="300044"><option value="300492"><option value="301482"><option value="302979 - 302980"><option value="302981"><option value="306513"><option value="307214"><option value="307345"><option value="308054"></datalist>
    </div>
    
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    var mapObj = null;
    var tilesCarregados = new Set();
    var filtroFazenda = "";
    var temaAtivo = 1;
    var camadasGeo = [];
    var marcadoresLabels = [];

    $(document).ready(function() {
        setTimeout(function() {
            mapObj = window[document.querySelector('.folium-map').id];
            
            // Carregar Rótulos Únicos uma única vez
            $.getJSON("labels.json", function(data) {
                data.forEach(function(l) {
                    var marker = L.marker([l.lat, l.lng], {
                        icon: L.divIcon({ className: 'rotulo-unico', html: l.talhao }),
                        alt: l.fazenda
                    });
                    marcadoresLabels.push(marker);
                });
                refreshVisual();
            });

            // Carregar Tiles conforme o movimento
            $.getJSON("manifesto.json", function(data) {
                mapObj.on('moveend', function() { scanTiles(data); });
                scanTiles(data);
            });
        }, 600);
    });

    function mudarTema(t) { temaAtivo = t; refreshVisual(); }
    function atualizarMapa() { filtroFazenda = document.getElementById('input_fazenda').value; refreshVisual(); }

    function refreshVisual() {
        // Atualizar Linhas
        camadasGeo.forEach(function(c) {
            c.eachLayer(function(l) {
                var p = l.feature.properties;
                if (filtroFazenda !== "" && p.FAZENDA !== filtroFazenda) {
                    l.setStyle({ opacity: 0, weight: 0 });
                } else {
                    var cor = (temaAtivo == 1) ? getCor(p.CLASSE) : p.color_talhao;
                    l.setStyle({ color: cor, weight: 1, opacity: 0.8 });
                }
            });
        });

        // Atualizar Rótulos Únicos (Só aparecem no Tema 2)
        marcadoresLabels.forEach(function(m) {
            var visivel = (temaAtivo == 2) && (filtroFazenda === "" || m.options.alt === filtroFazenda);
            if (visivel) { m.addTo(mapObj); } else { mapObj.removeLayer(m); }
        });
    }

    function getCor(v) {
        return v <= 150 ? '#8c0000' : v <= 300 ? '#ff0000' : v <= 450 ? '#ffff00' : v <= 700 ? '#00ff00' : '#00fffa';
    }

    function scanTiles(manifesto) {
        var vBounds = mapObj.getBounds();
        manifesto.forEach(function(tile) {
            if (vBounds.intersects(L.latLngBounds(tile.bounds)) && !tilesCarregados.has(tile.arquivo)) {
                tilesCarregados.add(tile.arquivo);
                $.getJSON("tiles/" + tile.arquivo, function(geo) {
                    var layer = L.geoJson(geo, {
                        onEachFeature: function(f, l) {
                            l.bindTooltip("Fazenda: " + f.properties.FAZENDA + "<br>Talhão: " + f.properties.TALHAO);
                        }
                    }).addTo(mapObj);
                    camadasGeo.push(layer);
                    refreshVisual();
                });
            }
        });
    }
    </script>
